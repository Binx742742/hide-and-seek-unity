# The dream: Gullmouth is a nightmare everyone shares. Wake every dreamer and the hiders wake too.
# Clues (memory shards) make the dreamers easier to convince: a slower needle, a wider gold zone.
convince:
  hits: 3            # gold hits to wake a dreamer
  misses: 2          # misses before they scream and the mimic hears
  period: 1300       # ms for the needle to cross the bar, with 0 clues
  periodPerClue: 70  # ms slower per clue
  zone: 0.13         # width of the gold zone, 0..1, with 0 clues
  zonePerClue: 0.04
  zoneMax: 0.5
  cooldown: 12       # s a screaming dreamer won't listen
  reach: 2.6
dreamers:
  - { id: dreamer-1, name: "Old Haddie", home: [-5, -20], says: ["the nets... the nets are full of teeth", "it's tuesday. it's always tuesday", "my wife is waiting at the gate"] }
  - { id: dreamer-2, name: "Pell the gutter", home: [68, 30], says: ["count the crates. count them again", "the boss said no one leaves till dawn", "dawn doesn't come here, does it"] }
  - { id: dreamer-3, name: "Mags Dorran", home: [-27, 7], says: ["the boat's got no bottom, love", "i hear the bell but i can't find it", "who's that standing behind you"] }
  - { id: dreamer-4, name: "Young Tam", home: [5, -33], says: ["the water's warm. it shouldn't be warm", "mam says don't go near the cage", "i can't feel my hands"] }
  - { id: dreamer-5, name: "Foreman Grice", home: [-10, 80], says: ["shift's not over. shift is never over", "sign the sheet. sign it", "the lamps buzz my name"] }
clues:
  - { id: clue-1, pic: "/cdn/value.743666cbf35667e607e34751b18725fcb3ee607f5a36e46a432ad40d3af202d5.png", at: [10, -25], text: "a clock with no hands. time isn't moving here." }
