  - { id: clue-3, pic: "/cdn/value.efcc4381623e5939f5860998ed2fc2e9017b1071b64f98689e67d4313e40665d.png", at: [72, -6], text: "a fish, swimming through the air. this isn't real." }
  - { id: clue-4, pic: "/cdn/value.df5aa9442a4fde538948213430630daa7a329a417d8a3f70d42d48ccc0368a81.png", at: [-30, 10], text: "WAKE UP, in your own handwriting." }
  - { id: clue-5, pic: "/cdn/value.a2802c94fecac4756ccbd41378c44443e8f4f03ad6473432b0eedf0f4708af90.png", at: [-26, 64], text: "stairs that climb into the sky and stop." }
  - { id: clue-6, pic: "/cdn/value.e4091737a5519461360172e5267fe1039c7dd9e64a84ee685214abe8620a61a4.png", at: [84, 60], text: "a mirror with no one in it. not even you." }
